services:
  - type: web
    name: clothing-api
    runtime: docker
    rootDir: api-server
    region: oregon
    plan: free
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: deploy
      - key: APP_PORT
        value: "8080"
      - key: PORT
        value: "8080"
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://clothing.id.vn
      - key: STOREFRONT_BASE_URL
        value: https://clothing.id.vn
      - key: SPRING_FLYWAY_ENABLED
        value: "false"
      - key: JPA_DDL_AUTO
        value: update
      - key: REDIS_ENABLED
        value: "false"
      - key: RABBITMQ_ENABLED
        value: "false"
      - key: ELASTICSEARCH_ENABLED
        value: "false"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_SECONDS
        value: "86400"
      - key: JWT_REFRESH_EXPIRATION_SECONDS
        value: "2592000"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_JWK_SET_URI
        value: https://www.googleapis.com/oauth2/v3/certs
      - key: GOOGLE_ALLOWED_ISSUERS
        value: https://accounts.google.com,accounts.google.com
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET
        value: clothing-assets
      - key: R2_ENDPOINT
        sync: false
      - key: R2_REGION
        value: auto
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: R2_PRESIGN_EXPIRATION_MINUTES
        value: "15"
      - key: R2_MAX_FILE_SIZE_BYTES
        value: "10485760"
      - key: R2_ALLOWED_CONTENT_TYPES
        value: image/jpeg,image/png,image/webp,image/avif
      - key: R2_IMAGE_CACHE_CONTROL
        value: public, max-age=31536000, immutable
      - key: GHN_BASE_URL
        value: https://online-gateway.ghn.vn/shiip/public-api/master-data
      - key: GHN_SHIPPING_BASE_URL
        value: https://dev-online-gateway.ghn.vn/shiip/public-api/v2/shipping-order
      - key: GHN_TOKEN
        sync: false
      - key: GHN_SHOP_ID
        sync: false
      - key: MOMO_ENDPOINT
        value: https://test-payment.momo.vn/v2/gateway/api/create
      - key: MOMO_PARTNER_CODE
        sync: false
      - key: MOMO_ACCESS_KEY
        sync: false
      - key: MOMO_SECRET_KEY
        sync: false
      - key: MOMO_REDIRECT_URL
        value: https://clothing.id.vn/payment/result
      - key: MOMO_IPN_URL
        sync: false
      - key: MOMO_REQUEST_TYPE
        value: captureWallet
      - key: VNPAY_ENDPOINT
        value: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_RETURN_URL
        value: https://clothing.id.vn/payment/result
      - key: VNPAY_IPN_URL
        sync: false
      - key: VNPAY_LOCALE
        value: vn
      - key: VNPAY_ORDER_TYPE
        value: other
      - key: VNPAY_IP_ADDRESS
        value: 127.0.0.1
      - key: VNPAY_EXPIRE_MINUTES
        value: "15"
