server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: clothing-be
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clothing}
    username: ${DB_USER:clothing}
    password: ${DB_PASSWORD:clothing}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    ignore-migration-patterns: ["*:missing"]
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
    elasticsearch:
      repositories:
        enabled: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 3s
    socket-timeout: 10s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:15MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:30MB}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    org.springframework.security: INFO

app:
  integrations:
    redis:
      enabled: ${REDIS_ENABLED:false}
    rabbit:
      enabled: ${RABBITMQ_ENABLED:false}
    elasticsearch:
      enabled: ${ELASTICSEARCH_ENABLED:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}
  jwt:
    # >= 32 bytes for HS256
    secret: ${JWT_SECRET:clothing-super-secret-key-need-32-bytes-min}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:2592000}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
    allowed-issuers: ${GOOGLE_ALLOWED_ISSUERS:https://accounts.google.com,accounts.google.com}
  r2:
    account-id: ${R2_ACCOUNT_ID:your-account-id}
    access-key: ${R2_ACCESS_KEY:your-access-key}
    secret-key: ${R2_SECRET_KEY:your-secret-key}
    bucket: ${R2_BUCKET:clothing-assets}
    endpoint: ${R2_ENDPOINT:https://your-account-id.r2.cloudflarestorage.com}
    region: ${R2_REGION:auto}
    public-base-url: ${R2_PUBLIC_BASE_URL:https://cdn.example.com}
    presign-expiration-minutes: ${R2_PRESIGN_EXPIRATION_MINUTES:15}
    max-file-size-bytes: ${R2_MAX_FILE_SIZE_BYTES:10485760}
    allowed-content-types: ${R2_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp,image/avif}
    image-cache-control: ${R2_IMAGE_CACHE_CONTROL:public, max-age=31536000, immutable}
  messaging:
    order:
      exchange: ${ORDER_EVENT_EXCHANGE:order.exchange}
      queue: ${ORDER_PROCESSING_QUEUE:order.processing.queue}
      routing-key: ${ORDER_CREATED_ROUTING_KEY:order.created}
  payment:
    cleanup-fixed-delay-ms: ${PAYMENT_CLEANUP_FIXED_DELAY_MS:300000}
    momo-order-timeout-check-fixed-delay-ms: ${MOMO_ORDER_TIMEOUT_CHECK_FIXED_DELAY_MS:60000}
  search:
    timeout-ms: ${SEARCH_TIMEOUT_MS:400}
    fallback-max-size: ${SEARCH_FALLBACK_MAX_SIZE:20}
    metrics-window-size: ${SEARCH_METRICS_WINDOW_SIZE:200}
  ghn:
    base-url: ${GHN_BASE_URL:https://online-gateway.ghn.vn/shiip/public-api/master-data}
    shipping-base-url: ${GHN_SHIPPING_BASE_URL:https://online-gateway.ghn.vn/shiip/public-api/v2/shipping-order}
    token: ${GHN_TOKEN:}
    shop-id: ${GHN_SHOP_ID:}
  momo:
    endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
    partner-code: ${MOMO_PARTNER_CODE:}
    access-key: ${MOMO_ACCESS_KEY:}
    secret-key: ${MOMO_SECRET_KEY:}
    redirect-url: ${MOMO_REDIRECT_URL:http://localhost:5173/orders}
    ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/payments/momo/ipn}
    request-type: ${MOMO_REQUEST_TYPE:captureWallet}
  vnpay:
    endpoint: ${VNPAY_ENDPOINT:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    return-url: ${VNPAY_RETURN_URL:http://localhost:5173/orders}
    ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/payments/vnpay/ipn}
    locale: ${VNPAY_LOCALE:vn}
    order-type: ${VNPAY_ORDER_TYPE:other}
    ip-address: ${VNPAY_IP_ADDRESS:127.0.0.1}
    expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}
  mail:
    brevo:
      api-key: ${BREVO_API_KEY:}
      sender-email: ${BREVO_SENDER_EMAIL:}
