services:
  postgres:
    image: postgres:16-alpine
    container_name: clothing-postgres
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=50
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: ${POSTGRES_MEM_LIMIT:-320m}
    cpus: ${POSTGRES_CPUS:-0.35}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clothing-redis
    command: redis-server --appendonly no --save ""
    ports:
      - "${REDIS_PORT}:6379"
    mem_limit: ${REDIS_MEM_LIMIT:-96m}
    cpus: ${REDIS_CPUS:-0.15}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: clothing-rabbitmq
    ports:
      - "${RABBITMQ_PORT}:5672"
    mem_limit: ${RABBITMQ_MEM_LIMIT:-192m}
    cpus: ${RABBITMQ_CPUS:-0.2}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: clothing-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      xpack.watcher.enabled: "false"
      ES_JAVA_OPTS: "${ELASTICSEARCH_ES_JAVA_OPTS}"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    mem_limit: ${ELASTICSEARCH_MEM_LIMIT:-512m}
    cpus: ${ELASTICSEARCH_CPUS:-0.3}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  be:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clothing-be
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      APP_PORT: ${APP_PORT}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      ELASTICSEARCH_URIS: ${ELASTICSEARCH_URIS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS}
      JWT_REFRESH_EXPIRATION_SECONDS: ${JWT_REFRESH_EXPIRATION_SECONDS}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_JWK_SET_URI: ${GOOGLE_JWK_SET_URI}
      GOOGLE_ALLOWED_ISSUERS: ${GOOGLE_ALLOWED_ISSUERS}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_REGION: ${R2_REGION}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
      R2_PRESIGN_EXPIRATION_MINUTES: ${R2_PRESIGN_EXPIRATION_MINUTES}
      R2_MAX_FILE_SIZE_BYTES: ${R2_MAX_FILE_SIZE_BYTES}
      R2_ALLOWED_CONTENT_TYPES: ${R2_ALLOWED_CONTENT_TYPES}
      R2_IMAGE_CACHE_CONTROL: ${R2_IMAGE_CACHE_CONTROL}
      GHN_BASE_URL: ${GHN_BASE_URL}
      GHN_SHIPPING_BASE_URL: ${GHN_SHIPPING_BASE_URL}
      GHN_TOKEN: ${GHN_TOKEN}
      GHN_SHOP_ID: ${GHN_SHOP_ID}
      MOMO_ENDPOINT: ${MOMO_ENDPOINT}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY}
      MOMO_REDIRECT_URL: ${MOMO_REDIRECT_URL}
      MOMO_IPN_URL: ${MOMO_IPN_URL}
      MOMO_REQUEST_TYPE: ${MOMO_REQUEST_TYPE}
      VNPAY_ENDPOINT: ${VNPAY_ENDPOINT}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL}
      VNPAY_LOCALE: ${VNPAY_LOCALE}
      VNPAY_ORDER_TYPE: ${VNPAY_ORDER_TYPE}
      VNPAY_IP_ADDRESS: ${VNPAY_IP_ADDRESS}
      VNPAY_EXPIRE_MINUTES: ${VNPAY_EXPIRE_MINUTES}
      JAVA_OPTS: ${JAVA_OPTS}
    ports:
      - "${APP_PORT}:8080"
    mem_limit: ${BE_MEM_LIMIT:-320m}
    cpus: ${BE_CPUS:-0.35}

volumes:
  postgres_data:
    name: backend_postgres_data
    external: true
  es_data:
