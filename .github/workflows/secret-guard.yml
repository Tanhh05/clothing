name: Secret Guard (Manual and Nightly)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run secret guard
        run: |
          set -euo pipefail
          if [[ -f "scripts/check-no-secrets.sh" ]]; then
            bash scripts/check-no-secrets.sh
            exit 0
          fi

          echo "scripts/check-no-secrets.sh not found, using fallback scan."
          PATTERN='(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z\-_]{35}|ghp_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{82,}|xox[baprs]-[0-9A-Za-z-]{10,}|-----BEGIN (RSA|EC|OPENSSH|DSA|PGP) PRIVATE KEY-----)'
          if git grep -nEI "${PATTERN}" -- . \
            ':(exclude)*.md' \
            ':(exclude)*.mdx' \
            ':(exclude)*.lock' \
            ':(exclude)*package-lock.json' \
            ':(exclude)*pnpm-lock.yaml' \
            ':(exclude)*yarn.lock' \
            ':(exclude)api-server/.env.example' \
            ':(exclude)storefront/.env.example'; then
            echo "Potential leaked secrets found."
            exit 1
          fi
          echo "Secret guard passed."
