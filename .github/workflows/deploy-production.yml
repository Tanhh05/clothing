name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Commit SHA to deploy"
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy_backend:
    name: Deploy Backend to Production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check required production secrets
        id: precheck
        run: |
          missing=0
          for v in PROD_SSH_HOST PROD_SSH_USER PROD_SSH_PRIVATE_KEY PROD_SSH_PORT PROD_APP_DIR; do
            if [[ -z "${!v}" ]]; then
              echo "Missing secret: $v"
              missing=1
            fi
          done
          if [[ "$missing" -eq 1 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_APP_DIR: ${{ secrets.PROD_APP_DIR }}

      - name: Deploy backend via SSH
        if: ${{ steps.precheck.outputs.ready == 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.PROD_APP_DIR }}"
            git fetch --all --prune
            git checkout -f "${{ github.event.inputs.git_sha }}"
            cd api-server
            docker compose build be
            docker compose up -d --force-recreate be

      - name: Skip deploy (missing production secrets)
        if: ${{ steps.precheck.outputs.ready != 'true' }}
        run: |
          echo "Skipping deploy: production SSH secrets are not configured."

  smoke_test_backend:
    name: Smoke Test Production API
    runs-on: ubuntu-latest
    needs: deploy_backend
    environment: production
    if: ${{ needs.deploy_backend.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke test
        env:
          BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          TIMEOUT_SECONDS: "180"
          RETRY_INTERVAL_SECONDS: "6"
        run: |
          if [[ -z "${BASE_URL}" ]]; then
            echo "Skipping smoke test: PROD_API_BASE_URL is not configured."
            exit 0
          fi
          bash scripts/smoke-test-api.sh

  smoke_test_storefront:
    name: Smoke Test Production Storefront
    runs-on: ubuntu-latest
    needs: deploy_backend
    environment: production
    if: ${{ needs.deploy_backend.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run storefront smoke test
        env:
          BASE_URL: ${{ secrets.PROD_STOREFRONT_BASE_URL }}
          TIMEOUT_SECONDS: "180"
          RETRY_INTERVAL_SECONDS: "6"
        run: |
          if [[ -z "${BASE_URL}" ]]; then
            echo "Skipping storefront smoke test: PROD_STOREFRONT_BASE_URL is not configured."
            exit 0
          fi
          bash scripts/smoke-test-storefront.sh

  smoke_test_admin:
    name: Smoke Test Production Admin Portal
    runs-on: ubuntu-latest
    needs: deploy_backend
    environment: production
    if: ${{ needs.deploy_backend.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run admin smoke test
        env:
          BASE_URL: ${{ secrets.PROD_ADMIN_BASE_URL }}
        run: |
          if [[ -z "${BASE_URL}" ]]; then
            echo "Skipping admin smoke test: PROD_ADMIN_BASE_URL is not configured."
            exit 0
          fi
          bash scripts/smoke-test-admin.sh
