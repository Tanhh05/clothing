name: CI

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "api-server/**"
      - "storefront/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "api-server/**"
      - "storefront/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret_guard:
    name: Secret Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check leaked secrets
        run: bash scripts/check-no-secrets.sh

  backend:
    name: Backend Test and Verify
    runs-on: ubuntu-latest
    needs: secret_guard
    defaults:
      run:
        working-directory: api-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit tests
        run: mvn -B -ntp clean test

      - name: Maven verify
        run: mvn -B -ntp -DskipTests verify

      - name: Docker build check
        run: docker build -t clothing-backend:ci .

  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest
    needs: secret_guard
    defaults:
      run:
        working-directory: storefront
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: storefront/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
