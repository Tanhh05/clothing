name: Deploy Staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Commit SHA to deploy (optional)"
        required: false
        default: ""

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy_backend:
    name: Deploy Backend to Staging
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Check required staging secrets
        id: precheck
        run: |
          missing=0
          for v in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_PRIVATE_KEY STAGING_SSH_PORT STAGING_APP_DIR; do
            if [[ -z "${!v}" ]]; then
              echo "Missing secret: $v"
              missing=1
            fi
          done
          if [[ "$missing" -eq 1 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_APP_DIR: ${{ secrets.STAGING_APP_DIR }}

      - name: Resolve deploy SHA
        id: meta
        if: ${{ steps.precheck.outputs.ready == 'true' }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.git_sha }}" ]]; then
            echo "sha=${{ github.event.inputs.git_sha }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy backend via SSH
        if: ${{ steps.precheck.outputs.ready == 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.STAGING_APP_DIR }}"
            git fetch --all --prune
            git checkout -f "${{ steps.meta.outputs.sha }}"
            cd api-server
            docker compose build be
            docker compose up -d --force-recreate be

      - name: Skip deploy (missing staging secrets)
        if: ${{ steps.precheck.outputs.ready != 'true' }}
        run: |
          echo "Skipping deploy: staging SSH secrets are not configured."

  smoke_test_backend:
    name: Smoke Test Staging API
    runs-on: ubuntu-latest
    needs: deploy_backend
    environment: staging
    if: ${{ needs.deploy_backend.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke test
        env:
          BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          TIMEOUT_SECONDS: "180"
          RETRY_INTERVAL_SECONDS: "6"
        run: |
          if [[ -z "${BASE_URL}" ]]; then
            echo "Skipping smoke test: STAGING_API_BASE_URL is not configured."
            exit 0
          fi
          bash scripts/smoke-test-api.sh

  smoke_test_storefront:
    name: Smoke Test Staging Storefront
    runs-on: ubuntu-latest
    needs: deploy_backend
    environment: staging
    if: ${{ needs.deploy_backend.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run storefront smoke test
        env:
          BASE_URL: ${{ secrets.STAGING_STOREFRONT_BASE_URL }}
          TIMEOUT_SECONDS: "180"
          RETRY_INTERVAL_SECONDS: "6"
        run: |
          if [[ -z "${BASE_URL}" ]]; then
            echo "Skipping storefront smoke test: STAGING_STOREFRONT_BASE_URL is not configured."
            exit 0
          fi
          bash scripts/smoke-test-storefront.sh

  smoke_test_admin:
    name: Smoke Test Staging Admin Portal
    runs-on: ubuntu-latest
    needs: deploy_backend
    environment: staging
    if: ${{ needs.deploy_backend.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run admin smoke test
        env:
          BASE_URL: ${{ secrets.STAGING_ADMIN_BASE_URL }}
        run: |
          if [[ -z "${BASE_URL}" ]]; then
            echo "Skipping admin smoke test: STAGING_ADMIN_BASE_URL is not configured."
            exit 0
          fi
          bash scripts/smoke-test-admin.sh
