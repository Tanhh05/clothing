name: Deploy Staging

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      git_sha:
        description: "Commit SHA to deploy (optional)"
        required: false
        default: ""

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Resolve deploy SHA
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.git_sha }}" ]]; then
            echo "sha=${{ github.event.inputs.git_sha }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy backend to staging via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.STAGING_APP_DIR }}"
            git fetch --all --prune
            git checkout -f "${{ steps.meta.outputs.sha }}"
            cd backend
            docker compose build be
            docker compose up -d --force-recreate be

  smoke_test:
    runs-on: ubuntu-latest
    needs: deploy
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run staging smoke test
        env:
          BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
          TIMEOUT_SECONDS: "180"
          RETRY_INTERVAL_SECONDS: "6"
        run: bash scripts/smoke-test-api.sh
